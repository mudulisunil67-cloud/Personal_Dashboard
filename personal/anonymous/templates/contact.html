{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Contact</title>

    <link rel="stylesheet" href="{% static 'css/contact.css' %}" />
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  </head>

  <body>
    <!-- Navigation Bar -->
    <nav>
      <ul>
        <li><a href="/">HOME</a></li>
        <li><a href="/contact/" class="active">CONTACT</a></li>
        <li><a href="/projects/">PROJECTS</a></li>
        <li><a href="/linkedin/">LINKEDIN</a></li>
        <li><a href="/leetcode/">LEETCODE</a></li>
        <li><a href="/certificate/">CERTIFICATE</a></li>
        <li><a href="/help/">HELP</a></li>
      </ul>
    </nav>

    <!-- Contact Information -->
    <div class="contact-container">
      <h1>Contact Me</h1>
      <p class="subtitle">
        Feel free to send me a message or share your feedback.
      </p>

      <form method="post">
        {% csrf_token %}

        <!-- Name -->
        <div class="form-group">
          <label for="name">NAME</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
          />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">
            <i class="fa-solid fa-envelope-open"></i>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required
          />
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label for="phone"><i class="fa-solid fa-phone"></i></label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
          />
        </div>

        <!-- Message -->
        <div class="form-group">
          <label for="message">MESSAGE</label>
          <textarea
            id="message"
            name="message"
            rows="4"
            placeholder="Write your message here..."
            required
          ></textarea>
        </div>

        <!-- Five Star Review -->
        <div class="form-group">
          <label>REVIEW</label>

          <div class="rating">
            <input type="radio" id="star5" name="review" value="5" />
            <label for="star5" title="5 stars">★</label>

            <input type="radio" id="star4" name="review" value="4" />
            <label for="star4" title="4 stars">★</label>

            <input type="radio" id="star3" name="review" value="3" />
            <label for="star3" title="3 stars">★</label>

            <input type="radio" id="star2" name="review" value="2" />
            <label for="star2" title="2 stars">★</label>

            <input type="radio" id="star1" name="review" value="1" />
            <label for="star1" title="1 star">★</label>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </div>
  </body>
</html>
